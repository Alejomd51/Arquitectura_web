      <rect x="325" y="28" width="150" height="62" rx="16" fill="#fff" stroke="#dce8e8" stroke-width="2"/>
      <circle cx="360" cy="59" r="15" fill="#e1f3f1"/>
      <circle cx="360" cy="55" r="5" fill="#2c8883"/>
      <path d="M350 69c2-7 18-7 20 0" fill="#2c8883"/>
      <text x="414" y="65" fill="#17233e" font-size="15" font-weight="700">Usuario</text>
    </g>
    <path d="M400 94v30m0 0H170v24m230-24v24m0-24h230v24" fill="none" stroke="#448b89" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="400" y="113" fill="#55777a" font-size="11" font-weight="700" letter-spacing="1.4">COMUNICACIÓN POR RED</text>

    <g filter="url(#shadow)">
      <rect x="70" y="157" width="200" height="174" rx="19" fill="#fff" stroke="#b6ded8" stroke-width="2"/>
      <rect x="300" y="157" width="200" height="174" rx="19" fill="#fff" stroke="#bbcef5" stroke-width="2"/>
      <rect x="530" y="157" width="200" height="174" rx="19" fill="#fff" stroke="#f1d9b2" stroke-width="2"/>
      <rect x="70" y="157" width="200" height="48" rx="18" fill="#e2f4f1"/>
      <path d="M70 187v18h200v-18" fill="#e2f4f1"/>
      <rect x="300" y="157" width="200" height="48" rx="18" fill="#e8efff"/>
      <path d="M300 187v18h200v-18" fill="#e8efff"/>
      <rect x="530" y="157" width="200" height="48" rx="18" fill="#fff1da"/>
      <path d="M530 187v18h200v-18" fill="#fff1da"/>

      <circle cx="105" cy="181" r="10" fill="#32938d"/>
      <path d="M102 176v10m6-10v10m-9-5h12" stroke="#fff" stroke-width="1.5"/>
      <circle cx="335" cy="181" r="10" fill="#5279cf"/>
      <path d="m330 181 4-4 3 3 4-4" fill="none" stroke="#fff" stroke-width="1.7"/>
      <circle cx="565" cy="181" r="10" fill="#d39135"/>
      <path d="M560 177h10v9h-10zm2-2v3m6-3v3" fill="none" stroke="#fff" stroke-width="1.5"/>

