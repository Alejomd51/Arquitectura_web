      <text x="400" y="185" fill="#294b8e" font-size="14" font-weight="750">Catálogo</text>
      <text x="630" y="185" fill="#815719" font-size="14" font-weight="750">Pedidos</text>

      <text x="170" y="236" fill="#6c7d8b" font-size="12">Servicio independiente</text>
      <text x="400" y="236" fill="#6c7d8b" font-size="12">Servicio independiente</text>
      <text x="630" y="236" fill="#6c7d8b" font-size="12">Servicio independiente</text>
      <rect x="96" y="259" width="148" height="39" rx="10" fill="#f5faf9"/>
