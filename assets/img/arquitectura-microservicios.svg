      <rect x="342" y="367" width="116" height="42" rx="12" fill="#fff" stroke="#dce8e8" stroke-width="2"/>
      <rect x="572" y="367" width="116" height="42" rx="12" fill="#fff" stroke="#dce8e8" stroke-width="2"/>
      <text x="170" y="393" fill="#526675" font-size="11" font-weight="700">Datos propios</text>
      <text x="400" y="393" fill="#526675" font-size="11" font-weight="700">Datos propios</text>
      <text x="630" y="393" fill="#526675" font-size="11" font-weight="700">Datos propios</text>
