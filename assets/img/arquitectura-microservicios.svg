<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de arquitectura de microservicios</title>
  <desc id="desc">Un usuario accede a varios servicios independientes de usuarios, catálogo y pedidos; cada servicio puede tener su propio despliegue y almacenamiento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#19315f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#448b89"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="720" cy="70" r="95" fill="#d9f0ed" opacity=".7"/>
  <circle cx="70" cy="400" r="100" fill="#e6efff" opacity=".65"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
